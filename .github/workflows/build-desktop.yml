name: Build Windows and Linux desktop

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Windows installer as an Agent Desk prerelease
        type: boolean
        default: false
      sync_pr:
        description: Merged upstream stable PR number to build from main
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: build-desktop-${{ (github.event_name == 'pull_request' || inputs.publish) && 'publish' || 'build' }}-${{ github.event.pull_request.number || inputs.sync_pr || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}

env:
  T3CODE_TELEMETRY_ENABLED: "false"
  T3CODE_OTEL_SDK_DISABLED: "true"
  OTEL_SDK_DISABLED: "true"

jobs:
  linux:
    name: Linux x64
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.repository == 'ririo08/agent-desk' &&
       github.event.pull_request.merged &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'upstream/stable-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      upstream_tag: ${{ steps.source.outputs.upstream_tag }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Select the release source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PR: ${{ github.event.pull_request.number || inputs.sync_pr }}
        run: |
          if [[ -z "$SYNC_PR" ]]; then
            printf 'commit=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $GITHUB_REF != refs/heads/main || ! $SYNC_PR =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Select main and enter the number of a merged stable sync PR.'
            exit 1
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$SYNC_PR" | jq -er --arg repo "$GITHUB_REPOSITORY" '
            select(.merged and .base.ref == "main" and .head.repo.full_name == $repo)
            | [.head.ref, .merge_commit_sha, .merged_at] | @tsv
          ')
          read -r branch commit merged_at <<< "$pr"
          if [[ ! $branch =~ ^upstream/stable-v[0-9]+\.[0-9]+\.[0-9]+$ || ! $commit =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::The merged PR must come from a stable upstream sync branch.'
            exit 1
          fi
          tag=${branch#upstream/stable-}
          stable_tag=$(gh api "repos/pingdotgg/t3code/releases/tags/$tag" \
            --jq 'select(.draft == false and .prerelease == false) | .tag_name')
          if [[ $stable_tag != "$tag" ]]; then
            echo '::error::The PR must integrate a published, stable upstream release.'
            exit 1
          fi

          # The merge date and PR number keep the release version stable across retries.
          version="${tag#v}-preview.$(TZ=Asia/Tokyo date -d "$merged_at" +%Y%m%d).$SYNC_PR"
          printf 'commit=%s\nupstream_tag=%s\nversion=%s\n' "$commit" "$tag" "$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.source.outputs.commit }}
          fetch-depth: ${{ steps.source.outputs.upstream_tag == '' && 1 || 0 }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/drop-checkout-credentials

      - name: Verify the merged upstream tag
        if: steps.source.outputs.upstream_tag != ''
        env:
          UPSTREAM_TAG: ${{ steps.source.outputs.upstream_tag }}
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git "refs/tags/$UPSTREAM_TAG"
          upstream_commit=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          previous_main=$(git rev-parse --verify 'HEAD^1^{commit}')
          if ! git merge-base --is-ancestor "$upstream_commit" HEAD ||
            git merge-base --is-ancestor "$upstream_commit" "$previous_main"; then
            echo "::error::This PR merge must introduce upstream $UPSTREAM_TAG into main."
            exit 1
          fi

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libatomic1 libsecret-1-dev pkg-config imagemagick libgtk-3-0t64 libnss3 libasound2t64 libgbm1 patchelf

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install workspace dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Set the preview version
        id: version
        env:
          SYNC_VERSION: ${{ steps.source.outputs.version }}
        run: |
          version=$SYNC_VERSION
          if [[ -z "$version" ]]; then
            base=$(node -p "require('./apps/server/package.json').version.split('-')[0]")
            version="$base-preview.$(TZ=Asia/Tokyo date +%Y%m%d).$GITHUB_RUN_NUMBER"
          fi
          node scripts/update-release-package-versions.ts "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build the Linux AppImage
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/build-desktop-artifact.ts --platform linux --target AppImage --arch x64 --build-version "$BUILD_VERSION" --verbose

      - name: Build and smoke-test the Linux CLI for WSL
        env:
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p cli-resource-monitor/linux-x64
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor cli-resource-monitor/linux-x64/
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$BUILD_VERSION" --resource-monitor-dir cli-resource-monitor --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$BUILD_VERSION-linux-x64.tar.gz" --expect-version "$BUILD_VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-appimage
          path: release/*.AppImage
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-cli
          path: release-cli/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows:
    name: Windows x64
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.linux.outputs.commit }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/drop-checkout-credentials

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install workspace dependencies
        run: vp install --frozen-lockfile --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-x64-cli
          path: wsl-runtime

      - name: Build the Windows NSIS installer
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.linux.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/update-release-package-versions.ts $env:BUILD_VERSION
          rustup target add x86_64-pc-windows-msvc
          $archive = "wsl-runtime/t3-${env:BUILD_VERSION}-linux-x64.tar.gz"
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version $env:BUILD_VERSION --wsl-runtime $archive --verbose

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-nsis
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish the Windows prerelease
    if: >-
      github.repository == 'ririo08/agent-desk' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'pull_request' || inputs.publish)
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x64-nsis
          path: release

      - name: Create a GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_VERSION: ${{ needs.linux.outputs.version }}
          SOURCE_COMMIT: ${{ needs.linux.outputs.commit }}
          UPSTREAM_TAG: ${{ needs.linux.outputs.upstream_tag }}
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          installers=(*.exe)
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one Windows installer."
            exit 1
          fi
          installer="Agent-Desk-Setup-${BUILD_VERSION}-x64.exe"
          mv -- "${installers[0]}" "$installer"
          sha256sum -- "$installer" > SHA256SUMS.txt
          tag="agent-desk-v$BUILD_VERSION"
          notes='Unsigned Windows x64 preview with an embedded Linux CLI for WSL. Install manually. Agent Desk is an unofficial MIT-licensed fork of T3 Code, unaffiliated with T3 Tools.'
          if [[ -n "$UPSTREAM_TAG" ]]; then
            notes+=$'\n\n'"Upstream release: https://github.com/pingdotgg/t3code/releases/tag/$UPSTREAM_TAG"
          fi

          if existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,targetCommitish); then
            if [[ $(jq -r .isDraft <<< "$existing") == true ]]; then
              if [[ $(jq -r .targetCommitish <<< "$existing") != "$SOURCE_COMMIT" ]]; then
                echo "::error::The existing draft $tag targets a different commit."
                exit 1
              fi
            else
              actual_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)
              if [[ $actual_commit != "$SOURCE_COMMIT" ]]; then
                echo "::error::The existing release $tag points to a different commit."
                exit 1
              fi
              echo "Release $tag is already published for this commit."
              exit 0
            fi
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
              --title "Agent Desk $BUILD_VERSION" --draft --prerelease --latest=false --notes "$notes"
          fi

          gh release upload "$tag" "$installer" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
