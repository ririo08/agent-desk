name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pull-request-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and related tests
    if: github.repository == 'ririo08/agent-desk'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      T3CODE_TELEMETRY_ENABLED: "false"
      T3CODE_OTEL_SDK_DISABLED: "true"
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/drop-checkout-credentials

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1 libsecret-1-dev pkg-config

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Install workspace dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium for browser tests
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          browser=$(find "$HOME/.cache/ms-playwright" -name chrome-headless-shell -type f -print -quit)
          test -n "$browser"
          if ldd "$browser" | grep '=> not found'; then
            node apps/web/node_modules/playwright/cli.js install-deps chromium
          fi

      - name: Check the changed packages and tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi
          # SQLite test fixtures perform many synchronous writes on large sync PRs.
          TMPDIR=$(mktemp -d /dev/shm/agent-desk-pr-tests.XXXXXX)
          export TMPDIR
          vp run check:changed --typecheck-and-test "$BASE_SHA"
